apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: orchestration-api }
  template:
    metadata:
      labels: { app: orchestration-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/example/ai-orchestration-core:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: orchestration-secrets } }]
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 30 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-worker
spec:
  replicas: 2
  selector:
    matchLabels: { app: orchestration-worker }
  template:
    metadata:
      labels: { app: orchestration-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/ai-orchestration-core:latest
          command: ["node", "dist/workers/worker.js"]
          envFrom: [{ secretRef: { name: orchestration-secrets } }]
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration-api
spec:
  selector: { app: orchestration-api }
  ports:
    - port: 80
      targetPort: 8080
